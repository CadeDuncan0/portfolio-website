<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
  <!-- Order Intake Platform: orders stream down three intake lanes into a hex
       processing core and leave on one outbound lane, over a data-city skyline. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f28" />
      <stop offset=".58" stop-color="#070a18" />
      <stop offset="1" stop-color="#04050c" />
    </linearGradient>
    <radialGradient id="washCyan">
      <stop offset="0" stop-color="#00eaff" stop-opacity=".26" />
      <stop offset="1" stop-color="#00eaff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="washMag">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity=".24" />
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coreGlow">
      <stop offset="0" stop-color="#00eaff" stop-opacity=".4" />
      <stop offset=".55" stop-color="#00eaff" stop-opacity=".1" />
      <stop offset="1" stop-color="#00eaff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pip">
      <stop offset="0" stop-color="#ff9bec" />
      <stop offset=".38" stop-color="#ff2bd6" stop-opacity=".8" />
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00eaff" stop-opacity="0" />
      <stop offset=".5" stop-color="#00eaff" stop-opacity=".3" />
      <stop offset="1" stop-color="#00eaff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="floorFade" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="512">
      <stop offset="0" stop-color="#fff" stop-opacity=".15" />
      <stop offset=".4" stop-color="#fff" stop-opacity=".9" />
      <stop offset="1" stop-color="#fff" stop-opacity=".45" />
    </linearGradient>
    <mask id="floorMask">
      <rect width="1024" height="512" fill="url(#floorFade)" />
    </mask>
    <radialGradient id="reflectMag">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity=".4" />
      <stop offset=".5" stop-color="#ff2bd6" stop-opacity=".12" />
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="reflectCyan">
      <stop offset="0" stop-color="#00eaff" stop-opacity=".22" />
      <stop offset="1" stop-color="#00eaff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="belowHorizon">
      <rect y="301" width="1024" height="211" />
    </clipPath>
    <pattern id="litWindows" width="20" height="26" patternUnits="userSpaceOnUse">
      <rect x="5" y="7" width="8" height="11" fill="#00eaff" fill-opacity=".22" />
    </pattern>

    <path id="towers" d="M20 300V214h58v86zM86 300v-48h36v48zM130 300V178h68v122zM206 300v-64h40v64zM254 300V200h76v100zM338 300v-42h32v42zM378 300v-76h52v76zM438 300V208h64v92zM510 300v-56h40v56zM558 300V190h70v110zM636 300v-50h34v50zM678 300v-84h56v84zM742 300v-52h40v52zM790 300V186h72v114zM870 300v-56h38v56zM916 300V206h60v94zM984 300v-46h30v46z" />
    <path id="caps" d="M22 215h54M132 179h64M256 201h72M380 225h48M440 209h60M560 191h66M680 217h52M792 187h68M918 207h56" />
    <path id="hex" d="M608 196 560 279 464 279 416 196 464 113 560 113Z" />
    <path id="hexIn" d="M578 196 550 244 494 244 466 196 494 148 550 148Z" />
    <path id="laneA" d="M0 116h198l44 44h200" />
    <path id="laneB" d="M0 196h442" />
    <path id="laneC" d="M0 276h198l44-44h200" />
    <path id="laneOut" d="M608 196h416" />
  </defs>

  <rect width="1024" height="512" fill="url(#sky)" />
  <ellipse cx="150" cy="110" rx="430" ry="270" fill="url(#washCyan)" />
  <ellipse cx="900" cy="80" rx="380" ry="250" fill="url(#washMag)" />

  <!-- data city -->
  <use href="#towers" fill="#080c1e" stroke="#00eaff" stroke-opacity=".3" stroke-width="2" />
  <use href="#towers" fill="url(#litWindows)" />
  <use href="#caps" fill="none" stroke="#00eaff" stroke-opacity=".85" stroke-width="4" stroke-linecap="round" />

  <!-- horizon -->
  <rect x="0" y="280" width="1024" height="42" fill="url(#horizonGlow)" />
  <rect x="0" y="299" width="1024" height="2" fill="#8ef6ff" opacity=".7" />

  <!-- floor grid -->
  <g mask="url(#floorMask)" stroke="#00eaff" fill="none" stroke-width="1.6">
    <g stroke-opacity=".4">
      <path d="M512 300 482 512M512 300 436 512M512 300 376 512M512 300 298 512M512 300 192 512M512 300 42 512M512 300-178 512M512 300 542 512M512 300 588 512M512 300 648 512M512 300 726 512M512 300 832 512M512 300 982 512M512 300 1202 512" />
    </g>
    <g stroke-opacity=".34">
      <path d="M0 306h1024M0 315h1024M0 325h1024M0 340h1024M0 359h1024M0 385h1024M0 419h1024M0 461h1024" />
    </g>
  </g>

  <!-- core reflected on the floor -->
  <g clip-path="url(#belowHorizon)">
    <ellipse cx="512" cy="302" rx="440" ry="96" fill="url(#reflectCyan)" />
    <ellipse cx="512" cy="306" rx="120" ry="200" fill="url(#reflectMag)" />
  </g>

  <!-- intake lanes -->
  <g fill="none" stroke-linecap="square">
    <g stroke="#00eaff">
      <use href="#laneA" stroke-width="16" stroke-opacity=".07" />
      <use href="#laneB" stroke-width="16" stroke-opacity=".07" />
      <use href="#laneC" stroke-width="16" stroke-opacity=".07" />
      <use href="#laneA" stroke-width="3.5" stroke-opacity=".55" />
      <use href="#laneB" stroke-width="3.5" stroke-opacity=".55" />
      <use href="#laneC" stroke-width="3.5" stroke-opacity=".55" />
    </g>
    <g stroke="#ff2bd6">
      <use href="#laneOut" stroke-width="16" stroke-opacity=".08" />
      <use href="#laneOut" stroke-width="3.5" stroke-opacity=".6" />
    </g>
  </g>

  <!-- orders in flight -->
  <g fill="#7df3ff">
    <rect x="34" y="107" width="36" height="18" rx="3" />
    <rect x="120" y="107" width="36" height="18" rx="3" />
    <rect x="292" y="151" width="36" height="18" rx="3" />
    <rect x="22" y="187" width="36" height="18" rx="3" />
    <rect x="128" y="187" width="36" height="18" rx="3" />
    <rect x="242" y="187" width="36" height="18" rx="3" />
    <rect x="66" y="267" width="36" height="18" rx="3" />
    <rect x="312" y="223" width="36" height="18" rx="3" />
  </g>
  <g fill="#ff8ae8">
    <rect x="682" y="187" width="36" height="18" rx="3" />
    <rect x="800" y="187" width="36" height="18" rx="3" />
    <rect x="918" y="187" width="36" height="18" rx="3" />
  </g>

  <!-- processing core -->
  <circle cx="512" cy="196" r="210" fill="url(#coreGlow)" />
  <use href="#hex" fill="#05070f" fill-opacity=".9" />
  <g fill="none" stroke="#00eaff" stroke-linejoin="round">
    <use href="#hex" stroke-width="20" stroke-opacity=".1" />
    <use href="#hex" stroke-width="5" />
    <use href="#hexIn" stroke-width="2.5" stroke-opacity=".4" />
  </g>
  <circle cx="512" cy="196" r="66" fill="url(#pip)" />
  <circle cx="512" cy="196" r="21" fill="#ffdbf7" />
</svg>
