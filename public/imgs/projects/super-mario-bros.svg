<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
  <!-- Super Mario Bros. NES Recreation: 8-bit level built out of neon —
       question block, block staircase, warp pipe and a brick floor. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0a2e" />
      <stop offset=".6" stop-color="#0a0718" />
      <stop offset="1" stop-color="#05040e" />
    </linearGradient>
    <radialGradient id="washCyan">
      <stop offset="0" stop-color="#00eaff" stop-opacity=".22" />
      <stop offset="1" stop-color="#00eaff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sunHalo">
      <stop offset=".4" stop-color="#ff2bd6" stop-opacity=".28" />
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sunFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcee0a" />
      <stop offset=".5" stop-color="#ff7a3c" />
      <stop offset="1" stop-color="#ff2bd6" />
    </linearGradient>
    <mask id="sunMask">
      <rect x="392" y="82" width="336" height="348" fill="#fff" />
      <g fill="#000">
        <rect x="392" y="286" width="336" height="5" />
        <rect x="392" y="308" width="336" height="7" />
        <rect x="392" y="332" width="336" height="10" />
        <rect x="392" y="360" width="336" height="14" />
        <rect x="392" y="392" width="336" height="20" />
      </g>
    </mask>
    <pattern id="brick" width="64" height="40" patternUnits="userSpaceOnUse">
      <rect width="64" height="40" fill="#1c0a2e" />
      <g stroke="#ff2bd6" stroke-opacity=".5" stroke-width="2" fill="none">
        <path d="M0 1h64M0 21h64M1 1v20M33 1v20M17 21v20M49 21v20" />
      </g>
    </pattern>
    <path id="cloud" d="M24 0h24v8h16v8h8v8H0v-8h8V8h16z" />
  </defs>

  <rect width="1024" height="512" fill="url(#sky)" />
  <ellipse cx="140" cy="90" rx="380" ry="240" fill="url(#washCyan)" />

  <!-- sun -->
  <circle cx="560" cy="250" r="250" fill="url(#sunHalo)" />
  <circle cx="560" cy="250" r="168" fill="url(#sunFill)" mask="url(#sunMask)" />

  <!-- pixel clouds -->
  <g fill="#bff0ff" fill-opacity=".18" stroke="#00eaff" stroke-opacity=".45" stroke-width="2.5">
    <use href="#cloud" transform="translate(96 96) scale(1.6)" />
    <use href="#cloud" transform="translate(772 62) scale(1.15)" />
  </g>

  <!-- question block -->
  <g>
    <rect x="296" y="246" width="96" height="96" rx="4" fill="#1b1405" stroke="#fcee0a" stroke-opacity=".14" stroke-width="16" />
    <rect x="300" y="250" width="88" height="88" rx="2" fill="#1b1405" stroke="#fcee0a" stroke-width="4" />
    <g fill="#fcee0a" fill-opacity=".7">
      <rect x="310" y="260" width="8" height="8" />
      <rect x="370" y="260" width="8" height="8" />
      <rect x="310" y="320" width="8" height="8" />
      <rect x="370" y="320" width="8" height="8" />
    </g>
    <g fill="#fcee0a">
      <rect x="324" y="254" width="40" height="10" />
      <rect x="314" y="264" width="20" height="10" />
      <rect x="354" y="264" width="20" height="10" />
      <rect x="354" y="274" width="20" height="10" />
      <rect x="344" y="284" width="20" height="10" />
      <rect x="334" y="294" width="20" height="10" />
      <rect x="334" y="304" width="20" height="10" />
      <rect x="334" y="324" width="20" height="10" />
    </g>
  </g>

  <!-- block staircase -->
  <g fill="#071a2e" stroke="#00eaff" stroke-width="3">
    <rect x="40" y="386" width="44" height="44" />
    <rect x="84" y="386" width="44" height="44" />
    <rect x="84" y="342" width="44" height="44" />
    <rect x="128" y="386" width="44" height="44" />
    <rect x="128" y="342" width="44" height="44" />
    <rect x="128" y="298" width="44" height="44" />
  </g>
  <g fill="#00eaff" fill-opacity=".55">
    <rect x="50" y="396" width="8" height="8" />
    <rect x="94" y="396" width="8" height="8" />
    <rect x="94" y="352" width="8" height="8" />
    <rect x="138" y="396" width="8" height="8" />
    <rect x="138" y="352" width="8" height="8" />
    <rect x="138" y="308" width="8" height="8" />
  </g>

  <!-- warp pipe -->
  <g fill="#062a20" stroke="#00ffae" stroke-width="4">
    <rect x="824" y="352" width="96" height="80" />
    <rect x="808" y="314" width="128" height="42" rx="3" />
  </g>
  <g fill="#00ffae" fill-opacity=".35">
    <rect x="838" y="360" width="12" height="66" />
    <rect x="822" y="324" width="12" height="24" />
  </g>

  <!-- brick floor -->
  <rect y="430" width="1024" height="82" fill="url(#brick)" />
  <rect y="428" width="1024" height="3" fill="#ff8ae8" opacity=".8" />
  <rect y="431" width="1024" height="26" fill="#ff2bd6" opacity=".07" />
</svg>
